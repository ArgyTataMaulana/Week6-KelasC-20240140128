<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JastipKu - Layanan Jasa Titip</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <header>
    <h1>🛍️ JastipKu</h1>
    <p>Titip barang impianmu dari mana saja dengan mudah!</p>
  </header>

  <main>
    <!-- Bagian 1: Fetch API - Katalog Barang Jastip -->
    <section id="products-section">
      <h2>Katalog Barang Jastip Populer</h2>
      <div id="loading" class="status">Sedang mengambil katalog barang jastip...</div>
      <div id="error" class="status error-msg" style="display: none;"></div>
      <div id="product-list" class="product-grid"></div>
    </section>

    <hr>

    <!-- Bagian 2: Form DOM & Event Handling - Form Request Jastip -->
    <section id="form-section">
      <h2>Form Request Titip Barang</h2>
      <p>Barang yang kamu cari tidak ada di katalog? Kirim permintaan titip di bawah ini:</p>

      <form id="jastip-form">
        <div class="form-group">
          <label for="namaPemesan">Nama Pemesan:</label>
          <input type="text" id="namaPemesan" placeholder="Contoh: Aris">
        </div>

        <div class="form-group">
          <label for="namaBarang">Nama Barang / Merek:</label>
          <input type="text" id="namaBarang" placeholder="Contoh: Matchamu Green Tea powder">
        </div>

        <div class="form-group">
          <label for="negaraAsal">Negara / Asal Pembelian:</label>
          <select id="negaraAsal">
            <option value="">-- Pilih Negara --</option>
            <option value="Jepang">Jepang</option>
            <option value="Korea Selatan">Korea Selatan</option>
            <option value="Singapura">Singapura</option>
            <option value="Lainnya">Lainnya</option>
          </select>
        </div>

        <div class="form-group">
          <label for="catatan">Catatan Khusus (Jumlah / Varian / Size):</label>
          <textarea id="catatan" placeholder="Contoh: Rasa Original, isi 2 pcs"></textarea>
        </div>

        <button type="submit">Kirim Request Jastip</button>
      </form>

      <!-- Pesan Feedback Dinamis -->
      <div id="form-message" class="message-box"></div>
    </section>
  </main>

  <script src="js/fetchProducts.js"></script>
  <script src="js/formHandler.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
